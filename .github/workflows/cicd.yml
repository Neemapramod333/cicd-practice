name: CI/CD - Budget Portal

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check the page has a title
        run: grep -q "<title>" index.html

      - name: Check the Kochi discount is shown
        run: grep -q "Kochi discount" index.html

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Package the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to the live website
        id: deployment
        uses: actions/deploy-pages@v4
